<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Attestable">
  <!--
    The mark: a shield (coverage) whose check is formed from two strokes of
    different colour — the two chains. Evidence originates on one, settlement
    happens on the other, and the check is where they meet.

    Kept to two shapes so it still reads at 16px in a browser tab.
  -->
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a9eff"/>
      <stop offset="1" stop-color="#2b6fd1"/>
    </linearGradient>
  </defs>

  <path d="M32 4 54 12v20c0 12.5-8.5 23.5-22 28C18.5 55.5 10 44.5 10 32V12z"
        fill="url(#a)"/>

  <!-- descending stroke: the source chain -->
  <path d="M20 32.5 29 41.5" fill="none" stroke="#0b0e14" stroke-width="6.5"
        stroke-linecap="round" opacity=".9"/>
  <!-- ascending stroke: the settlement chain -->
  <path d="M29 41.5 45 24" fill="none" stroke="#ffffff" stroke-width="6.5"
        stroke-linecap="round"/>
</svg>
