[profile.default]
src = "contracts"
out = "out"
libs = ["node_modules"]
test = "test"

# Pinned to match Creditcoin's official reference repo
# (gluwa/usc-testnet-bridge-examples), which is proven to compile against
# @gluwa/usc-contracts. Not inherited from the machine's standalone solc.
solc_version = "0.8.30"
evm_version = "shanghai"

optimizer = true
optimizer_runs = 200

# Creditcoin guidance (Q10) for forge script against their testnet, whose block
# headers lack prevRandao. NOTE: forge 1.3.5-stable does not surface this key in
# `forge config`, and it silently ignores unknown keys — so its effect here is
# UNVERIFIED. Left in place as harmless-if-inert. Deployment plans to use
# `forge create` (as Creditcoin's own reference repo does), which avoids the
# code path this setting addresses. Resolve definitively at Phase 3.
bypass_prevrandao = true

[rpc_endpoints]
creditcoin_testnet = "${CREDITCOIN_RPC_URL}"
sepolia = "${SOURCE_CHAIN_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"
